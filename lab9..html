<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Windows 11 CMD User Management Lab</title>
<style>
    :root {
        --win-bg: url('https://images.unsplash.com/photo-1617471346061-5d329ab9c574?q=80&w=1920&auto=format&fit=crop');
        --taskbar-bg: rgba(20, 20, 20, 0.85);
        --accent: #0067C0;
        --win-color: #ffffff;
    }

    body, html {
        margin: 0; padding: 0; width: 100%; height: 100%;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        overflow: hidden; background-color: #000; user-select: none;
    }

    #desktop {
        width: 100%; height: 100%; background: var(--win-bg) no-repeat center center fixed;
        background-size: cover; position: relative;
    }

    /* Instruction Panel */
    #instruction-panel {
        position: absolute; top: 20px; right: 20px; width: 340px;
        background: rgba(255, 255, 255, 0.95); border: 3px solid var(--accent);
        border-radius: 8px; padding: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        z-index: 10000; color: #1B1B1B;
    }
    #instruction-panel h3 { margin: 0 0 10px 0; font-size: 15px; color: var(--accent); }
    #instruction-text { margin: 0; font-size: 13.5px; line-height: 1.6; }
    #instruction-text code { background: #e0e0e0; padding: 2px 5px; border-radius: 4px; font-weight: bold; color: #d84315; }

    /* Taskbar */
    .taskbar {
        position: absolute; bottom: 0; left: 0; right: 0; height: 50px;
        background: var(--taskbar-bg); backdrop-filter: blur(20px);
        display: flex; align-items: center; justify-content: center; gap: 15px; z-index: 8000;
    }
    .tb-icon {
        width: 36px; height: 36px; border-radius: 4px; display: flex;
        align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 20px; color: white;
    }
    .tb-icon:hover { background: rgba(255, 255, 255, 0.1); }

    /* Start Menu */
    #start-menu {
        position: absolute; bottom: 60px; left: 50%; transform: translateX(-50%);
        width: 650px; height: 520px; background: rgba(243, 243, 243, 0.95);
        backdrop-filter: blur(20px); border-radius: 10px; box-shadow: 0 5px 30px rgba(0,0,0,0.4);
        display: none; flex-direction: column; padding: 30px 30px 15px 30px; z-index: 7500; border: 1px solid #ccc;
    }
    #start-menu.show { display: flex; }
    
    .sm-search-input { 
        width: 100%; padding: 10px 15px; border-radius: 20px; border: 1px solid #ccc; 
        font-size: 14px; margin-bottom: 20px; box-sizing: border-box; outline: none; background: #fff;
    }
    .sm-search-input:focus { border-color: var(--accent); }

    .sm-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 15px; }
    .sm-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; padding: 10px 5px; border-radius: 5px; text-align: center; }
    .sm-item:hover { background: rgba(0,0,0,0.05); }
    .sm-item .icon { font-size: 32px; margin-bottom: 8px; display: flex; align-items: center; justify-content: center;}
    .sm-item .text { font-size: 11px; }

    /* Search Results Style */
    #sm-search-view { display: none; flex-grow: 1; }
    .search-res-container { display: flex; gap: 20px; height: 100%; }
    .search-res-left { width: 50%; border-right: 1px solid #ddd; padding-right: 10px;}
    .search-res-right { width: 50%; padding-left: 10px; display: flex; flex-direction: column; align-items: center; text-align: center;}
    
    .search-res-item { display: flex; align-items: center; gap: 15px; padding: 10px; cursor: pointer; border-radius: 5px; background: rgba(0,0,0,0.05); }
    .search-res-item .icon { font-size: 24px; display: flex; align-items: center; justify-content: center; width: 40px; height: 40px; }
    
    .search-action-btn { 
        width: 100%; text-align: left; padding: 10px; margin-top: 15px; border-radius: 5px; 
        cursor: pointer; font-size: 13px; display: flex; align-items: center; gap: 10px;
    }
    .search-action-btn:hover { background: rgba(0,0,0,0.05); }

    /* Start Menu Footer */
    .sm-footer {
        border-top: 1px solid #ccc; padding-top: 15px; display: flex; justify-content: space-between; align-items: center;
    }
    .sm-user { display: flex; align-items: center; gap: 10px; padding: 5px 10px; border-radius: 5px; font-size: 13px; font-weight: 500; }
    .user-avatar-small { width: 30px; height: 30px; background: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; color: white;}
    .sm-power { font-size: 20px; padding: 5px 10px; cursor: pointer; border-radius: 5px; }

    /* CMD Window */
    .window {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        background: #0c0c0c; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: none; flex-direction: column; overflow: hidden; border: 1px solid #333; z-index: 5000;
        width: 750px; height: 500px; color: #cccccc; font-family: Consolas, monospace;
    }
    .window.show { display: flex; }
    .win-header {
        height: 32px; background: #000; display: flex; align-items: center; justify-content: space-between;
        padding: 0 10px; font-size: 12px; color: #fff;
    }
    .win-title { display: flex; align-items: center; gap: 8px; }
    .win-controls span { padding: 5px 10px; cursor: pointer; }
    .win-controls span:hover { background: #e81123; color: white; }
    
    .cmd-body { padding: 10px; font-size: 14px; overflow-y: auto; flex-grow: 1; }
    .cmd-input-line { display: flex; margin-top: 5px; }
    .cmd-input-line input {
        background: transparent; border: none; color: #fff; font-family: Consolas, monospace;
        font-size: 14px; outline: none; flex-grow: 1; margin-left: 5px;
    }
    
    .cmd-output-table { display: grid; grid-template-columns: 250px 1fr; gap: 5px; margin-top: 10px; margin-bottom: 10px;}
    .cmd-output-table div { white-space: pre; }
    
    /* Scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 4px; }
</style>
</head>
<body onclick="hideStartMenu()">

    <!-- INSTRUCTION PANEL -->
    <div id="instruction-panel">
        <h3>📋 Lab Guide (CMD)</h3>
        <p id="instruction-text"></p>
    </div>

    <!-- Desktop -->
    <div id="desktop">
        
        <!-- Start Menu -->
        <div id="start-menu" onclick="event.stopPropagation()">
            <input type="text" class="sm-search-input" id="sm-search-input" placeholder="Type here to search" oninput="handleStartSearch()">
            
            <div id="sm-default-view" style="flex-grow: 1;">
                <div style="font-weight: bold; margin-bottom: 15px;">Pinned</div>
                <div class="sm-grid">
                    <div class="sm-item"><div class="icon">⚙️</div><div class="text">Settings</div></div>
                    <div class="sm-item"><div class="icon">📁</div><div class="text">Explorer</div></div>
                    <div class="sm-item"><div class="icon">🌐</div><div class="text">Edge</div></div>
                </div>
            </div>

            <div id="sm-search-view">
                <div class="search-res-container">
                    <div class="search-res-left">
                        <div style="font-weight: bold; margin-bottom: 15px;">Best match</div>
                        <div id="sm-search-results"></div>
                    </div>
                    <div class="search-res-right" id="sm-search-details" style="display: none;">
                        <div style="font-size: 64px; margin-top: 20px;">⬛</div>
                        <h3 style="margin: 10px 0 5px 0;">Command Prompt</h3>
                        <p style="margin: 0; color: #666; font-size: 12px;">App</p>
                        
                        <div style="width: 100%; margin-top: 20px; border-top: 1px solid #eee; padding-top: 10px;">
                            <div class="search-action-btn" onclick="openCmdAsAdmin()">
                                <span style="font-size: 16px;">🛡️</span> <b>Run as administrator</b>
                            </div>
                            <div class="search-action-btn" onclick="alert('Simulation: Please click Run as administrator for this lab.')">
                                <span style="font-size: 16px;">▶️</span> Open
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="sm-footer">
                <div class="sm-user">
                    <div class="user-avatar-small">👨‍💻</div>
                    <span>Administrator</span>
                </div>
                <div class="sm-power">⏻</div>
            </div>
        </div>

        <!-- Taskbar -->
        <div class="taskbar">
            <div class="tb-icon" onclick="toggleStartMenu(event)" title="Start">🪟</div>
        </div>

        <!-- CMD Window (Admin) -->
        <div class="window" id="cmd-win">
            <div class="win-header">
                <div class="win-title"><span>⬛</span> Administrator: Command Prompt</div>
                <div class="win-controls"><span onclick="document.getElementById('cmd-win').classList.remove('show')">✖</span></div>
            </div>
            <div class="cmd-body" id="cmd-body">
                Microsoft Windows [Version 10.0.22631.3007]<br>
                (c) Microsoft Corporation. All rights reserved.<br><br>
                <div class="cmd-input-line">
                    <span id="cmd-prompt">C:\Windows\System32></span>
                    <input type="text" id="cmd-input" autocomplete="off" onkeypress="handleCmd(event)">
                </div>
            </div>
        </div>

    </div>

<script>
    let currentStep = 1;
    let accountActive = "Yes";
    let isAdmin = false;
    let userDeleted = false;

    const instructions = {
        1: "<b>Step 1:</b> Click the <b>Start (🪟)</b> button, type <code>cmd</code> in the search box.",
        2: "<b>Step 2:</b> On the right side of the search results, click <b>🛡️ Run as administrator</b>.",
        3: "<b>Step 3 (Create User):</b> Type <code>net user User1 123 /add</code> and press Enter to create a new user.",
        4: "<b>Step 4 (View User):</b> Let's check if it was created successfully. Type <code>net user User1</code> and press Enter to view the account details.",
        5: "<b>Step 5 (Reset Password):</b> Now let's change the password. Type <code>net user User1 456</code> and press Enter.",
        6: "<b>Step 6 (Disable Account):</b> To disable the user account, type <code>net user User1 /active:no</code> and press Enter.",
        7: "<b>Step 7 (Verify Disable):</b> Type <code>net user User1</code> again and check the output. The 'Account active' status should now say 'No'.",
        8: "<b>Step 8 (Enable Account):</b> Let's re-enable the account. Type <code>net user User1 /active:yes</code> and press Enter.",
        9: "<b>Step 9 (Make Admin):</b> To add User1 to the Administrators group, type <code>net localgroup Administrators User1 /add</code>.",
        10: "<b>Step 10 (Verify Admin):</b> Type <code>net user User1</code> to view the user again. You will see *Administrators added in the Local Group Memberships section.",
        11: "<b>Step 11 (Delete User):</b> Now let's remove the user from the system. Type <code>net user User1 /delete</code> and press Enter.",
        12: "<b>Step 12 (Verify Deletion):</b> Finally, type <code>net user</code> to list all users. Verify that User1 is no longer in the list.",
        13: "✅ <b>Lab Complete!</b> You have successfully managed local users entirely using the Command Line Interface (CLI)."
    };

    function updateGuide() {
        document.getElementById('instruction-text').innerHTML = instructions[currentStep];
    }

    // Start Menu & Search Logic
    function toggleStartMenu(e) {
        if(e) e.stopPropagation();
        const menu = document.getElementById('start-menu');
        menu.classList.toggle('show');
        if(menu.classList.contains('show')) {
            document.getElementById('sm-search-input').value = '';
            document.getElementById('sm-search-input').focus();
            handleStartSearch();
        }
    }

    function hideStartMenu() {
        document.getElementById('start-menu').classList.remove('show');
    }

    function handleStartSearch() {
        const val = document.getElementById('sm-search-input').value.toLowerCase();
        const defView = document.getElementById('sm-default-view');
        const searchView = document.getElementById('sm-search-view');
        const results = document.getElementById('sm-search-results');
        const details = document.getElementById('sm-search-details');

        if(val.length > 0) {
            defView.style.display = 'none';
            searchView.style.display = 'flex';
            
            if(val.includes('cmd') || val.includes('command')) {
                results.innerHTML = `
                    <div class="search-res-item">
                        <div class="icon">⬛</div>
                        <div>
                            <div style="font-weight:bold; font-size:14px;">Command Prompt</div>
                            <div style="font-size:12px; color:#666;">App</div>
                        </div>
                    </div>`;
                details.style.display = 'flex';
                if(currentStep === 1) { currentStep = 2; updateGuide(); }
            } else {
                results.innerHTML = `<div style="padding: 10px; color:#666;">No results found for '${val}'</div>`;
                details.style.display = 'none';
            }
        } else {
            defView.style.display = 'block';
            searchView.style.display = 'none';
            details.style.display = 'none';
        }
    }
    
    function openCmdAsAdmin() {
        hideStartMenu();
        document.getElementById('cmd-win').classList.add('show');
        document.getElementById('cmd-input').focus();
        if(currentStep === 2) { currentStep = 3; updateGuide(); }
    }

    // CMD Logic
    function handleCmd(e) {
        if (e.key === 'Enter') {
            const input = document.getElementById('cmd-input');
            const val = input.value.trim(); 
            const valLower = val.toLowerCase().replace(/\s+/g, ' ');
            const cmdBody = document.getElementById('cmd-body');
            const prompt = `C:\\Windows\\System32>`;
            
            let output = `<br><br>${prompt} ${val}<br>`;
            
            // Lab Commands Checking
            if (valLower === 'net user user1 123 /add') {
                userDeleted = false;
                output += `The command completed successfully.`;
                if(currentStep === 3) { currentStep = 4; updateGuide(); }
            } 
            else if (valLower === 'net user user1') {
                if(userDeleted) {
                    output += `The user name could not be found.<br><br>More help is available by typing NET HELPMSG 2221.`;
                } else {
                    output += `
<div class="cmd-output-table">
    <div>User name</div><div>User1</div>
    <div>Full Name</div><div></div>
    <div>Comment</div><div></div>
    <div>User's comment</div><div></div>
    <div>Country/region code</div><div>000 (System Default)</div>
    <div>Account active</div><div>${accountActive}</div>
    <div>Account expires</div><div>Never</div>
</div>
<div class="cmd-output-table">
    <div>Password last set</div><div>9/18/2026 10:00:00 AM</div>
    <div>Password expires</div><div>Never</div>
    <div>Password changeable</div><div>9/18/2026 10:00:00 AM</div>
    <div>Password required</div><div>Yes</div>
    <div>User may change password</div><div>Yes</div>
</div>
<div class="cmd-output-table">
    <div>Workstations allowed</div><div>All</div>
    <div>Logon script</div><div></div>
    <div>User profile</div><div></div>
    <div>Home directory</div><div></div>
    <div>Last logon</div><div>Never</div>
</div>
<div class="cmd-output-table">
    <div>Logon hours allowed</div><div>All</div>
</div>
<div class="cmd-output-table">
    <div>Local Group Memberships</div><div>*Users      ${isAdmin ? '*Administrators' : ''}</div>
    <div>Global Group memberships</div><div>*None</div>
</div>
The command completed successfully.`;
                    
                    if(currentStep === 4) { currentStep = 5; updateGuide(); }
                    if(currentStep === 7) { currentStep = 8; updateGuide(); }
                    if(currentStep === 10) { currentStep = 11; updateGuide(); }
                }
            }
            else if (valLower === 'net user user1 456') {
                output += `The command completed successfully.`;
                if(currentStep === 5) { currentStep = 6; updateGuide(); }
            } 
            else if (valLower === 'net user user1 /active:no') {
                accountActive = "No";
                output += `The command completed successfully.`;
                if(currentStep === 6) { currentStep = 7; updateGuide(); }
            } 
            else if (valLower === 'net user user1 /active:yes') {
                accountActive = "Yes";
                output += `The command completed successfully.`;
                if(currentStep === 8) { currentStep = 9; updateGuide(); }
            } 
            else if (valLower === 'net localgroup administrators user1 /add') {
                isAdmin = true;
                output += `The command completed successfully.`;
                if(currentStep === 9) { currentStep = 10; updateGuide(); }
            } 
            else if (valLower === 'net user user1 /delete') {
                userDeleted = true;
                output += `The command completed successfully.`;
                if(currentStep === 11) { currentStep = 12; updateGuide(); }
            } 
            else if (valLower === 'net user') {
                output += `<br>User accounts for \\\\DESKTOP-8K3QF2L<br><br>`;
                output += `-------------------------------------------------------------------------------<br>`;
                if(!userDeleted) {
                    output += `Administrator            DefaultAccount           Guest<br>`;
                    output += `User1                    WDAGUtilityAccount<br>`;
                } else {
                    output += `Administrator            DefaultAccount           Guest<br>`;
                    output += `WDAGUtilityAccount<br>`;
                }
                output += `The command completed successfully.`;
                if(currentStep === 12) { currentStep = 13; updateGuide(); }
            }
            else if (val !== "") {
                output += `'${val}' is not recognized as an internal or external command,<br>operable program or batch file.`;
            }

            if(output !== '') {
                const newLine = document.createElement('div');
                newLine.innerHTML = output;
                input.parentElement.before(newLine);
            }
            input.value = '';
            cmdBody.scrollTop = cmdBody.scrollHeight;
        }
    }

    // Initialize
    updateGuide();
</script>
</body>
</html>
